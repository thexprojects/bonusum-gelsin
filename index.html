
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bonusum Gelsin · Deneme Bonusları</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 14px 10px 24px;
}

.page-container {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 16px;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 26px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.4px;
}

.subtitle {
  font-size: 13px;
  color: #6e6e73;
  font-weight: 600;
}

.bonus-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.bonus-card {
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  padding: 14px;
  border: 1px solid #ececec;
  box-shadow: 0 2px 8px rgba(0,0,0,.045);
}

.featured-card {
  padding: 17px;
  border: 2px solid #f3d7e4;
  background: linear-gradient(180deg, #ffffff 0%, #fffafb 100%);
  box-shadow: 0 8px 22px rgba(190,24,93,.08);
}

.featured-label {
  display: inline-flex;
  align-items: center;
  margin-bottom: 11px;
  padding: 6px 11px;
  border-radius: 999px;
  background: #ec4899;
  color: #ffffff;
  font-size: 11px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .3px;
}

.bonus-row {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
}

.logo-box {
  width: 118px;
  min-width: 118px;
  height: 52px;
  border-radius: 999px;
  background: #111827;
  border: 1px solid #374151;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 2px 6px rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 13px;
  overflow: hidden;
}

.featured-card .logo-box {
  width: 138px;
  min-width: 138px;
  height: 62px;
  background: #111827;
  border: 1px solid #374151;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 3px 8px rgba(0,0,0,.18);
}

.logo-box img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.bonus-title {
  flex: 1;
  min-width: 0;
  font-size: 22px;
  line-height: 1.12;
  font-weight: 900;
  color: #1d1d1f;
  letter-spacing: -0.35px;
}

.featured-card .bonus-title {
  font-size: 26px;
  color: #be185d;
}

.btn {
  display: block;
  width: 100%;
  margin-top: 13px;
  padding: 15px 16px;
  border-radius: 14px;
  background: #ec4899;
  color: #ffffff;
  text-align: center;
  text-decoration: none;
  font-size: 15px;
  line-height: 1;
  font-weight: 900;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.58);
  animation: pulse 2s infinite;
  transition: transform .15s ease, background .15s ease;
}

.featured-card .btn {
  padding: 17px 16px;
  font-size: 16px;
  background: #be185d;
  animation: featuredPulse 1.8s infinite;
}

.btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  animation: shine 3s infinite;
}

.btn:hover {
  background: #db2777;
  transform: translateY(-2px);
}

.featured-card .btn:hover {
  background: #9d174d;
}

.btn:active {
  transform: scale(.96);
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.50); }
  70% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
}

@keyframes featuredPulse {
  0% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0.55); }
  70% { box-shadow: 0 0 0 15px rgba(190, 24, 93, 0); }
  100% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0); }
}

@keyframes shine {
  100% { left: 140%; }
}

@media (max-width: 380px) {
  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .bonus-card {
    padding: 12px;
    border-radius: 18px;
  }

  .featured-card {
    padding: 14px;
  }

  .bonus-row {
    gap: 10px;
  }

  .logo-box {
    width: 102px;
    min-width: 102px;
    height: 48px;
    padding: 6px 10px;
  }

  .featured-card .logo-box {
    width: 116px;
    min-width: 116px;
    height: 54px;
  }

  .bonus-title {
    font-size: 19px;
  }

  .featured-card .bonus-title {
    font-size: 22px;
  }

  .btn {
    padding: 14px;
    font-size: 14px;
  }
}

@media (min-width: 700px) {
  .page {
    padding: 24px 18px 36px;
  }

  .header h1 {
    font-size: 31px;
  }

  .subtitle {
    font-size: 14px;
  }

  .bonus-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 17px 18px;
    border-radius: 22px;
  }

  .featured-card {
    padding: 22px;
  }

  .bonus-card.featured-card {
    position: relative;
  }

  .featured-label {
    position: absolute;
    top: -12px;
    left: 22px;
    margin-bottom: 0;
  }

  .bonus-row {
    flex: 1;
    gap: 18px;
  }

  .logo-box {
    width: 150px;
    min-width: 150px;
    height: 58px;
    padding: 8px 16px;
  }

  .featured-card .logo-box {
    width: 190px;
    min-width: 190px;
    height: 74px;
  }

  .bonus-title {
    font-size: 25px;
  }

  .featured-card .bonus-title {
    font-size: 33px;
  }

  .btn {
    width: 180px;
    margin-top: 0;
    padding: 17px 16px;
  }

  .featured-card .btn {
    width: 200px;
    padding: 19px 16px;
  }
}
</style>
</head>

<body>

function shuffleArray(array) {
  const shuffled = array.slice();

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }

  return shuffled;
}

function createBonusCard(bonus) {
  const card = document.createElement("div");
  card.className = bonus.featured ? "bonus-card featured-card" : "bonus-card";

  card.innerHTML = `
    ${bonus.featured ? '<div class="featured-label">ÖNE ÇIKAN BONUS</div>' : ''}

    <div class="bonus-row">
      <div class="logo-box">
        <img src="${bonus.logo}" alt="${bonus.site}">
      </div>

      <div class="bonus-title">${bonus.title}</div>
    </div>

    <a class="btn" href="${bonus.url}" target="_blank" rel="nofollow noopener">
      BONUSU AL
    </a>
  `;

  return card;
}

const bonusList = document.getElementById("bonus-list");

bonusList.appendChild(createBonusCard(featuredBonus));

shuffleArray(otherBonuses).forEach(function(bonus) {
  bonusList.appendChild(createBonusCard(bonus));
});
</script>
