<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bonusum Gelsin · Deneme Bonusları</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f7f9;
    color: #111827;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    padding: 16px 12px 24px;
  }

  .page-container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .header h1 {
    margin: 6px 0 5px;
    font-size: 25px;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: -0.3px;
  }

  .subtitle {
    font-size: 13px;
    color: #6b7280;
    font-weight: 500;
  }

  .bonus-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .bonus-card {
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 4px 14px rgba(17, 24, 39, 0.08);
    border: 1px solid rgba(17, 24, 39, 0.06);
  }

  .bonus-content {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .logo-box {
    width: 118px;
    min-width: 118px;
    height: 52px;
    border-radius: 999px;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px 13px;
    overflow: hidden;
  }

  .logo-box img {
    display: block;
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .bonus-title {
    flex: 1;
    min-width: 0;
    font-size: 21px;
    line-height: 1.12;
    font-weight: 950;
    letter-spacing: -0.45px;
    color: #111827;
  }

  .btn {
    display: block;
    width: 100%;
    margin-top: 13px;
    padding: 15px 16px;
    border-radius: 14px;
    background: #ec4899;
    color: #ffffff;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    line-height: 1;
    font-weight: 900;
    box-shadow: 0 4px 12px rgba(236, 72, 153, 0.32);
    transition: transform .12s ease, background .12s ease;
  }

  .btn:hover {
    background: #db2777;
  }

  .btn:active {
    transform: scale(0.985);
  }

  @media (max-width: 380px) {
    .page {
      padding-left: 10px;
      padding-right: 10px;
    }

    .bonus-card {
      padding: 12px;
      border-radius: 16px;
    }

    .bonus-content {
      gap: 10px;
    }

    .logo-box {
      width: 104px;
      min-width: 104px;
      height: 48px;
      padding: 6px 10px;
    }

    .bonus-title {
      font-size: 19px;
    }

    .btn {
      padding: 14px;
      font-size: 14px;
    }
  }

  @media (min-width: 700px) {
    .page {
      padding: 24px 18px 36px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 30px;
    }

    .subtitle {
      font-size: 14px;
    }

    .bonus-list {
      gap: 14px;
    }

    .bonus-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 18px;
      border-radius: 20px;
    }

    .bonus-content {
      flex: 1;
      gap: 18px;
    }

    .logo-box {
      width: 150px;
      min-width: 150px;
      height: 58px;
      padding: 8px 16px;
    }

    .bonus-title {
      font-size: 25px;
    }

    .btn {
      width: 180px;
      margin-top: 0;
      padding: 17px 16px;
      border-radius: 14px;
      font-size: 15px;
    }
  }
</style>
</head>

<body>
