<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Bonusum Gelsin · Deneme Bonusları</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f7f9;
  color: #111;
}

.page-container {
  max-width: 520px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 14px;
}

h1 {
  font-size: 24px;
  margin: 8px 0 4px;
}

.subtitle {
  font-size: 13px;
  color: #666;
}

.bonus-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bonus-card {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.bonus-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-box {
  width: 108px;
  min-width: 108px;
  height: 44px;
  background: #f3f4f6;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 12px;
}

.logo-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.bonus-info {
  flex: 1;
  min-width: 0;
}

.site-name {
  font-size: 11px;
  color: #777;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 3px;
}

.bonus-title {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.25;
}

.bonus-detail {
  margin-top: 8px;
  font-size: 13px;
  color: #555;
  line-height: 1.35;
}

.tag {
  display: inline-block;
  margin-top: 10px;
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #fce7f3;
  color: #be185d;
  font-weight: 700;
}

.btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: #ec4899;
  color: #fff;
  text-align: center;
  text-decoration: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 3px 8px rgba(236,72,153,.28);
}

.btn:active {
  transform: scale(.98);
}

@media (min-width: 700px) {
  .page-container {
    max-width: 760px;
  }

  .bonus-card {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bonus-main {
    flex: 1;
  }

  .btn {
    width: 160px;
    margin-top: 0;
  }
}
</style>
</head>

<body>
