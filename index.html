<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f7f9;

}

.page-container {
  max-width: 520px;
  margin: 0 auto;
}

.header {

}

h1 {
  font-size: 24px;

}

.subtitle {
  font-size: 13px;
  color: #666;
}

.bonus-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bonus-card {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.bonus-main {
  margin-bottom: 12px;
}

.bonus-top {
  display: flex;

  gap: 14px;
}

.logo-box {
  width: 110px;

  height: 48px;
  background: #f3f4f6;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
}

.logo-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.bonus-info {
  flex: 1;
}

.bonus-title {
  font-size: 22px;
  font-weight: 900;
  line-height: 1.1;
  color: #111;
}

.btn {
  display: block;
  width: 100%;
  text-align: center;
  text-decoration: none;
  background: #ec4899;
  color: #fff;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 3px 8px rgba(236,72,153,.28);

.btn:hover {
  background: #db2777;

@media (min-width: 700px) {
  .page-container {
    max-width: 760px;
  }

  .bonus-card {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bonus-main {
    flex: 1;
    margin-bottom: 0;
  }

    width: 180px;
  }
}
</style>

<div class="page-container">

  <div class="header">
    <h1>Deneme Bonusları</h1>
    <div class="subtitle">Güncel deneme bonusları</div>
  </div>

  <div id="bonus-list" class="bonus-list"></div>

</div>

<script>
const bonuses = [
  {
    site: "Ligobet",
    logoUrl: "https://raw.githubusercontent.com/thexprojects/filtre-bonus/main/logos/ligobet.png",
    title: "750 TL Deneme Bonusu",
    url: "https://cutt.ly/teEgZLls"
  },
  {
    site: "Maxwin",
    logoUrl: "https://raw.githubusercontent.com/thexprojects/filtre-bonus/main/logos/maxwin.png",
    title: "300 TL Deneme Bonusu",
    url: "https://cutt.ly/maxsocial?"
  },
  {
    site: "Mobilbahis",
    logoUrl: "https://raw.githubusercontent.com/thexprojects/filtre-bonus/main/logos/mobilbahis.png",
    title: "100 Freespin",
    url: "https://tinyurl.com/2kh8e3ab"
  },
  {
    site: "Rokubet",
    logoUrl: "https://raw.githubusercontent.com/thexprojects/filtre-bonus/main/logos/rokubet.png",
    title: "335 Freespin",
    url: "https://rokubetr.com/"
  },
  {
    site: "Tipobet",
    logoUrl: "https://raw.githubusercontent.com/thexprojects/filtre-bonus/main/logos/tipobet.png",
    title: "750 TL Freebet",
    url: "https://goo.su/Tipobet"
  }

  /* BURAYA 17 SİTENİN TAMAMINI EKLE */
];

const list = document.getElementById("bonus-list");

bonuses.forEach(bonus => {

  const card = document.createElement("div");
  card.className = "bonus-card";

  card.innerHTML = `
    <div class="bonus-main">

      <div class="bonus-top">

        <div class="logo-box">
          <img
            src="${bonus.logoUrl}"
            alt="${bonus.site}"
            onerror="this.style.display='none'"
          >
        </div>

        <div class="bonus-info">
          <div class="bonus-title">
            ${bonus.title}
          </div>
        </div>

      </div>

    </div>

    <a
      class="btn"
      href="${bonus.url}"
      target="_blank"
      rel="nofollow noopener"
    >
      Bonusumu Al
    </a>
  `;

  list.appendChild(card);

});
</script>
