
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bonusum Gelsin · Deneme Bonusları</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 14px 10px 24px;
}

.page-container {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 26px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.4px;
}

.subtitle {
  font-size: 13px;
  color: #6e6e73;
  font-weight: 600;
}

.bonus-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.bonus-card {
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  padding: 14px;
  border: 1px solid #ececec;
  box-shadow: 0 2px 8px rgba(0,0,0,.045);
}

.featured-card {
  padding: 18px;
  border: 2px solid #ec4899;
  background:
    radial-gradient(circle at top right, rgba(236,72,153,.16), transparent 35%),
    linear-gradient(180deg, #ffffff 0%, #fff3f8 100%);
  box-shadow:
    0 10px 28px rgba(190,24,93,.16),
    0 2px 8px rgba(0,0,0,.05);
}

.featured-label {
  display: inline-flex;
  align-items: center;
  margin-bottom: 12px;
  padding: 7px 12px;
  border-radius: 999px;
  background: #ec4899;
  color: #ffffff;
  font-size: 11px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .4px;
  box-shadow: 0 4px 10px rgba(236,72,153,.25);
}

.bonus-row {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
}

.logo-box {
  width: 118px;
  min-width: 118px;
  height: 52px;
  border-radius: 999px;
  background: #111827;
  border: 1px solid #374151;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 2px 6px rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 13px;
  overflow: hidden;
}

.featured-card .logo-box {
  width: 148px;
  min-width: 148px;
  height: 66px;
  background: #111827;
  border: 1px solid #374151;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 5px 14px rgba(0,0,0,.22);
}

.logo-box img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.bonus-title {
  flex: 1;
  min-width: 0;
  font-size: 22px;
  line-height: 1.12;
  font-weight: 900;
  color: #1d1d1f;
  letter-spacing: -0.35px;
}

.featured-card .bonus-title {
  font-size: 28px;
  color: #be185d;
  letter-spacing: -0.7px;
}

.btn {
  display: block;
  width: 100%;
  margin-top: 13px;
  padding: 15px 16px;
  border-radius: 14px;
  background: #ec4899;
  color: #ffffff;
  text-align: center;
  text-decoration: none;
  font-size: 15px;
  line-height: 1;
  font-weight: 900;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.58);
  animation: pulse 2s infinite;
  transition: transform .15s ease, background .15s ease;
}

.featured-card .btn {
  padding: 18px 16px;
  font-size: 17px;
  background: #be185d;
  animation: featuredPulse 1.8s infinite;
}

.btn::before,
.telegram-banner::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  animation: shine 3s infinite;
}

.btn:hover {
  background: #db2777;
  transform: translateY(-2px);
}

.featured-card .btn:hover {
  background: #9d174d;
}

.btn:active,
.telegram-banner:active {
  transform: scale(.96);
}

/* TELEGRAM BANNER */
.telegram-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 17px 16px;
  border-radius: 20px;
  text-decoration: none;
  color: #ffffff;
  background:
    radial-gradient(circle at top right, rgba(255,255,255,.28), transparent 32%),
    linear-gradient(135deg, #2AABEE 0%, #229ED9 48%, #0f7fc2 100%);
  border: 1px solid rgba(255,255,255,.22);
  box-shadow:
    0 9px 22px rgba(34,158,217,.28),
    0 3px 10px rgba(0,0,0,.08);
  position: relative;
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}

.telegram-banner:hover {
  transform: translateY(-2px);
  box-shadow:
    0 12px 26px rgba(34,158,217,.34),
    0 4px 12px rgba(0,0,0,.10);
}

.telegram-icon {
  width: 54px;
  min-width: 54px;
  height: 54px;
  border-radius: 999px;
  background: rgba(255,255,255,.95);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 4px 10px rgba(0,0,0,.12);
}

.telegram-icon svg {
  width: 30px;
  height: 30px;
  display: block;
}

.telegram-text {
  flex: 1;
  min-width: 0;
  font-size: 18px;
  line-height: 1.15;
  font-weight: 950;
  letter-spacing: -0.25px;
}

.telegram-cta {
  display: none;
  padding: 12px 16px;
  border-radius: 999px;
  background: #ffffff;
  color: #168acd;
  font-size: 13px;
  line-height: 1;
  font-weight: 950;
  white-space: nowrap;
  box-shadow: 0 3px 9px rgba(0,0,0,.12);
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.50); }
  70% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
}

@keyframes featuredPulse {
  0% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0.55); }
  70% { box-shadow: 0 0 0 16px rgba(190, 24, 93, 0); }
  100% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0); }
}

@keyframes shine {
  100% { left: 140%; }
}

@media (max-width: 380px) {
  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .bonus-card {
    padding: 12px;

  }

    gap: 10px;

    padding: 6px 10px;
  }

  .featured-card .logo-box {

    min-width: 122px;
    height: 56px;
  }

  .bonus-title {
    font-size: 19px;
  }

  .featured-card .bonus-title {
    font-size: 23px;
  }

  .btn {
    padding: 14px;
    font-size: 14px;
  }

  .featured-card .btn {
    padding: 16px;
    font-size: 15px;
  }

  .telegram-banner {
    gap: 11px;
    padding: 15px 13px;
    border-radius: 18px;
  }

  .telegram-icon {
    width: 48px;
    min-width: 48px;
    height: 48px;
  }

  .telegram-icon svg {
    width: 27px;
    height: 27px;
  }

  .telegram-text {
    font-size: 15px;
  }
}

@media (min-width: 700px) {
  .page {
    padding: 24px 18px 36px;
  }

  .header h1 {
    font-size: 31px;
  }

  .subtitle {
    font-size: 14px;
  }

  .bonus-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 17px 18px;
    border-radius: 22px;
  }

  .featured-card {
    padding: 24px;
  }

  .bonus-card.featured-card {
    position: relative;
  }

  .featured-label {
    position: absolute;
    top: -13px;
    left: 24px;
    margin-bottom: 0;
  }

  .bonus-row {
    flex: 1;
    gap: 18px;
  }

  .logo-box {
    width: 150px;
    min-width: 150px;
    height: 58px;
    padding: 8px 16px;
  }

  .featured-card .logo-box {
    width: 210px;
    min-width: 210px;
    height: 80px;
  }

  .bonus-title {
    font-size: 25px;
  }

  .featured-card .bonus-title {
    font-size: 36px;
  }

  .btn {
    width: 180px;
    margin-top: 0;
    padding: 17px 16px;
  }

  .featured-card .btn {
    width: 210px;
    padding: 20px 16px;
  }

  .telegram-banner {
    padding: 20px 22px;
    border-radius: 22px;
  }

  .telegram-icon {
    width: 64px;
    min-width: 64px;
    height: 64px;
  }

  .telegram-icon svg {
    width: 36px;
    height: 36px;
  }

  .telegram-text {
    font-size: 24px;
  }

  .telegram-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
}
</style>
</head>

function shuffleArray(array) {
  const shuffled = array.slice();

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }

  return shuffled;
}

function createBonusCard(bonus) {
  const card = document.createElement("div");

}
