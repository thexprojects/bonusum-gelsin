<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bonusum Gelsin · Deneme Bonusları</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 14px 10px 90px;
}

.page-container {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 8px 0 5px;
  font-size: 26px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.4px;
}

.subtitle {
  font-size: 13px;
  color: #6e6e73;
  font-weight: 600;
}

.congrats-banner {
  margin-top: 16px;
  padding: 16px 42px 16px 14px;
  border-radius: 20px;
  background:
    radial-gradient(circle at top right, rgba(236,72,153,.22), transparent 35%),
    linear-gradient(180deg, #ffffff 0%, #fff3f8 100%);
  border: 2px solid #ec4899;
  position: relative;
  overflow: hidden;
  animation: congratsPulse 1.4s infinite;
}

.congrats-banner::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation: congratsShine 2.6s infinite;
}

.congrats-title {
  display: block;
  font-size: 26px;
  line-height: 1;
  font-weight: 950;
  color: #ec4899;
  letter-spacing: -0.6px;
  animation: textBlink 1.15s infinite;
}

.congrats-text {
  display: block;
  margin-top: 8px;
  font-size: 17px;
  line-height: 1.2;
  font-weight: 950;
  color: #111827;
  letter-spacing: -0.3px;
}

.congrats-close {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 999px;
  background: rgba(17,24,39,.08);
  color: #111827;
  font-size: 19px;
  line-height: 1;
  font-weight: 900;
  cursor: pointer;
  z-index: 2;
}

.congrats-close:active {
  transform: scale(.92);
}

.congrats-banner.is-hidden {
  display: none;
}

.bonus-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.bonus-card {
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  padding: 14px;
  border: 1px solid #ececec;
  box-shadow: 0 2px 8px rgba(0,0,0,.045);
}

.featured-card {
  padding: 18px;
  border: 2px solid #ec4899;
  background:
    radial-gradient(circle at top right, rgba(236,72,153,.16), transparent 35%),
    linear-gradient(180deg, #ffffff 0%, #fff3f8 100%);
  box-shadow:
    0 10px 28px rgba(190,24,93,.16),
    0 2px 8px rgba(0,0,0,.05);
}

.featured-label {
  display: inline-flex;
  align-items: center;
  margin-bottom: 12px;
  padding: 7px 12px;
  border-radius: 999px;
  background: #ec4899;
  color: #ffffff;
  font-size: 11px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .4px;
  box-shadow: 0 4px 10px rgba(236,72,153,.25);
}

.bonus-row {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
}

.logo-box {
  width: 118px;
  min-width: 118px;
  height: 52px;
  border-radius: 999px;
  background: #111827;
  border: 1px solid #374151;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 2px 6px rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px 13px;
  overflow: hidden;
}

.featured-card .logo-box {
  width: 148px;
  min-width: 148px;
  height: 66px;
}

.logo-box img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.bonus-title {
  flex: 1;
  min-width: 0;
  font-size: 22px;
  line-height: 1.12;
  font-weight: 900;
  color: #1d1d1f;
  letter-spacing: -0.35px;
}

.featured-card .bonus-title {
  font-size: 28px;
  color: #be185d;
  letter-spacing: -0.7px;
}

.btn {
  display: block;
  width: 100%;
  margin-top: 13px;
  padding: 15px 16px;
  border-radius: 14px;
  background: #ec4899;
  color: #ffffff;
  text-align: center;
  text-decoration: none;
  font-size: 15px;
  line-height: 1;
  font-weight: 900;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.58);
  animation: pulse 2s infinite;
  transition: transform .15s ease, background .15s ease;
}

.featured-card .btn {
  padding: 18px 16px;
  font-size: 17px;
  background: #be185d;
  animation: featuredPulse 1.8s infinite;
}

.btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  animation: shine 3s infinite;
}

.btn:hover {
  background: #db2777;
  transform: translateY(-2px);
}

.featured-card .btn:hover {
  background: #9d174d;
}

.btn:active,
.share-button:active {
  transform: scale(.96);
}

.site-footer {
  margin-top: 22px;
  padding: 18px 10px 8px;
  text-align: center;
  font-size: 13px;
  color: #6e6e73;
}

.site-footer a {
  color: #229ED9;
  text-decoration: none;
  font-weight: 800;
}

.share-widget {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.share-title {
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  color: #1d1d1f;
  font-size: 11px;
  line-height: 1;
  font-weight: 900;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
  border: 1px solid rgba(0,0,0,.06);
  backdrop-filter: blur(8px);
}

.share-buttons {
  display: flex;
  gap: 8px;
}

.share-button {
  width: 42px;
  height: 42px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.14);
}

.share-button svg {
  width: 23px;
  height: 23px;
  display: block;
}

.share-whatsapp { background: #25D366; }
.share-telegram { background: #229ED9; }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.50); }
  70% { box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
}

@keyframes featuredPulse {
  0% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0.55); }
  70% { box-shadow: 0 0 0 16px rgba(190, 24, 93, 0); }
  100% { box-shadow: 0 0 0 0 rgba(190, 24, 93, 0); }
}

@keyframes shine {
  100% { left: 140%; }
}

@keyframes congratsPulse {
  0% {
    box-shadow:
      0 0 0 0 rgba(236,72,153,.42),
      0 8px 22px rgba(190,24,93,.12);
  }
  60% {
    box-shadow:
      0 0 0 10px rgba(236,72,153,0),
      0 8px 22px rgba(190,24,93,.16);
  }
  100% {
    box-shadow:
      0 0 0 0 rgba(236,72,153,0),
      0 8px 22px rgba(190,24,93,.12);
  }
}

@keyframes textBlink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .72; transform: scale(1.02); }
}

@keyframes congratsShine {
  100% { left: 140%; }
}

@media (max-width: 380px) {
  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .bonus-card {
    padding: 12px;
    border-radius: 18px;
  }

  .featured-card {
    padding: 15px;
  }

  .bonus-row {
    gap: 10px;
  }

  .logo-box {
    width: 102px;
    min-width: 102px;
    height: 48px;
    padding: 6px 10px;
  }

  .featured-card .logo-box {
    width: 122px;
    min-width: 122px;
    height: 56px;
  }

  .bonus-title {
    font-size: 19px;
  }

  .featured-card .bonus-title {
    font-size: 23px;
  }

  .btn {
    padding: 14px;
    font-size: 14px;
  }

  .featured-card .btn {
    padding: 16px;
    font-size: 15px;
  }

  .congrats-banner {
    padding: 14px 40px 14px 12px;
    border-radius: 18px;
  }

  .congrats-title {
    font-size: 23px;
  }

  .congrats-text {
    font-size: 14px;
  }

  .share-title {
    font-size: 10px;
    padding: 6px 9px;
  }

  .share-button {
    width: 39px;
    height: 39px;
  }
}

@media (min-width: 700px) {
  .page {
    padding: 24px 18px 100px;
  }

  .header h1 {

  }

  .subtitle {

  }

  .congrats-banner {
    padding: 19px 48px 19px 20px;
    border-radius: 22px;
  }

  .congrats-title {
    font-size: 34px;
  }

  .congrats-text {
    font-size: 22px;
  }

  .bonus-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 17px 18px;
    border-radius: 22px;
  }

  .featured-card {
    padding: 24px;
  }

  .bonus-card.featured-card {
    position: relative;
  }

  .featured-label {
    position: absolute;
    top: -13px;
    left: 24px;
    margin-bottom: 0;
  }

  .bonus-row {
    flex: 1;
    gap: 18px;
  }

  .logo-box {
    width: 150px;
    min-width: 150px;
    height: 58px;
    padding: 8px 16px;
  }

  .featured-card .logo-box {
    width: 210px;
    min-width: 210px;
    height: 80px;
  }

  .bonus-title {
    font-size: 25px;
  }

  .featured-card .bonus-title {
    font-size: 36px;
  }

  .btn {
    width: 180px;
    margin-top: 0;
    padding: 17px 16px;
  }

  .featured-card .btn {
    width: 210px;
    padding: 20px 16px;
  }

  .share-widget {
    right: 22px;
    bottom: 22px;
  }
}
</style>
</head>

<script>

  title: "1000 TL DENEME BONUSU",

const otherBonuses = [
  { site: "Maxwin", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/maxwin.png", title: "300 TL DENEME BONUSU", url: "https://rebrand.ly/bonuskutusumax" },
  { site: "Superbet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/superbet.png", title: "250 TL DENEME BONUSU", url: "https://tracker.superortaklik.com/link?btag=105918253_497350" },
  { site: "Damabet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/damabet.png", title: "500 TL DENEME BONUSU", url: "https://t.ly/bkutusudama" },
  { site: "Betgar", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/betgar.png", title: "5000 TL DENEME BONUSU", url: "https://girgara.com/MLIcUN" },
  { site: "Roketbet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/roketbet.png", title: "2500 TL DENEME BONUSU", url: "https://roketlegir.com/y91ZMX" },
  { site: "Romabet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/romabet.png", title: "500 TL DENEME BONUSU", url: "https://romagir1.com/GWaSyy" },
  { site: "Venombet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/venombet.png", title: "2500 TL DENEME BONUSU", url: "https://rebrand.ly/bonuskutusuvnm" },

  { site: "Dedebet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/dedebet.png", title: "500 TL DENEME BONUSU", url: "https://t.ly/bonuskutusudede" },
  { site: "Bahibom", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/bahibom.png", title: "1000 TL DENEME BONUSU", url: "https://t.ly/bonuskutusubahibom" },
  { site: "Sloto", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/sloto.png", title: "250 TL DENEME BONUSU", url: "https://t.ly/bonuskutususloto" },

  { site: "Betsin", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/betsin.png", title: "2500 TL DENEME BONUSU", url: "https://bsinplay.com/sin267" },
  { site: "Marsbahis", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/marsbahis.png", title: "200 TL DENEME BONUSU", url: "https://dub.sh/marsgit" },
  { site: "Radissonbet", logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/radissonbet.png", title: "500 TL DENEME BONUSU", url: "https://ptns.io/dEVSR" }
];

function shuffleArray(array) {
  const shuffled = array.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }
  return shuffled;
}

function createBonusCard(bonus) {
  const card = document.createElement("div");
  card.className = bonus.featured ? "bonus-card featured-card" : "bonus-card";

  card.innerHTML = `
    ${bonus.featured ? '<div class="featured-label">ÖNE ÇIKAN BONUS</div>' : ''}
    <div class="bonus-row">
      <div class="logo-box">
        <img src="${bonus.logo}" alt="${bonus.site}">
      </div>
      <div class="bonus-title">${bonus.title}</div>
    </div>
    <a class="btn" href="${bonus.url}" target="_blank" rel="nofollow noopener">BONUSU AL</a>
  `;

  return card;
}

const bonusList = document.getElementById("bonus-list");
bonusList.appendChild(createBonusCard(featuredBonus));
shuffleArray(otherBonuses).forEach(function(bonus) {
  bonusList.appendChild(createBonusCard(bonus));
});

const shareText = "18 farklı deneme bonusu tek linkte!\n\nhttps://dub.sh/sitebonuslari";

document.getElementById("congrats-close").addEventListener("click", function() {
  document.getElementById("congrats-banner").classList.add("is-hidden");
});
</script>
