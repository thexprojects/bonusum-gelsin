<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8 Siteye de Üye Ol</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}
.page{
  min-height:100vh;
  padding:10px 8px 14px;
}
.container{
  width:100%;
  max-width:980px;
  margin:0 auto;
}
.header{
  text-align:center;
  margin-bottom:10px;
}
.header h1{
  margin:0 0 5px;
  font-size:24px;
  line-height:1;
  font-weight:950;
}
.header p{
  margin:0;
  color:#cbd5e1;
  font-size:12px;
  font-weight:800;
}
.section{
  margin-bottom:12px;
}
.section-title{
  margin:0 0 8px;
  padding:10px;
  border-radius:14px;
  background:linear-gradient(135deg,#ec4899,#be185d);
  color:#fff;
  text-align:center;
  font-size:14px;
  font-weight:950;
  letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(236,72,153,.35);
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.card{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.095);
  border:1px solid rgba(255,255,255,.15);
  border-radius:19px;
  padding:11px 8px;
  box-shadow:0 8px 22px rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
}
.logo{
  height:50px;
  border-radius:999px;
  background:#050505;
  border:1px solid #374151;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 10px;
  margin-bottom:7px;
}
.logo img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.badge{
  display:inline-flex;
  margin-bottom:6px;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(34,197,94,.16);
  border:1px solid rgba(34,197,94,.48);
  color:#86efac;
  font-size:9px;
  line-height:1;
  font-weight:950;
}
.site-name{
  font-size:15px;
  line-height:1.05;
  font-weight:950;
  margin-bottom:5px;
}
.bonus{
  font-size:13px;
  line-height:1.1;
  font-weight:950;
  color:#f9a8d4;
  margin-bottom:8px;
}
.btn{
  display:block;
  width:100%;
  padding:11px 4px;
  border-radius:12px;
  background:#ec4899;
  color:#fff;
  font-size:11px;
  line-height:1;
  font-weight:950;
  position:relative;
  overflow:hidden;
}
.btn:before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 2.6s infinite;
}
.footer{
  margin-top:10px;
  text-align:center;
  font-size:11px;
}
.footer a{
  color:#f9a8d4;
  text-decoration:none;
  font-weight:900;
}
@keyframes shine{100%{left:140%}}

@media(min-width:700px){
  .page{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 18px;
  }
  .header h1{font-size:36px}
  .header p{font-size:15px}
  .section-title{font-size:15px}
  .grid{
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .card{
    padding:15px 10px;
    border-radius:22px;
    transition:.25s;
  }
  .card:hover{
    transform:translateY(-5px);
    border-color:#ec4899;
  }
  .logo{
    height:58px;
    margin-bottom:10px;
  }
  .site-name{font-size:16px}
  .bonus{font-size:14px}
  .btn{
    padding:13px 6px;
    font-size:12px;
  }
}
</style>
</head>

<body>
<div class="page">
  <div class="container">

    <header class="header">
      <h1>8 SİTEYE DE ÜYE OL</h1>
      <p>Toplam 4.000 TL deneme bonusu fırsatı</p>
    </header>

    <main id="sections"></main>

    <footer class="footer">
      <a href="https://t.me/clickprojects" target="_blank" rel="nofollow noopener">
        Telegram: @clickprojects
      </a>
    </footer>

  </div>
</div>

<script>
const groups = [
  {
    title: "GÜVENİLİR CASINO SİTELERİ",
    sites: [
      {
        name: "Sloto",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/sloto.png",
        url: "https://t.ly/bonuskutususloto"
      },
      {
        name: "Superbet",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/superbet.png",
        url: "https://tracker.superortaklik.com/link?btag=105918253_497350"
      },
      {
        name: "Maxwin",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/maxwin.png",
        url: "https://rebrand.ly/bonuskutusumax"
      },
      {
        name: "Betwoon",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/betwoon.png",
        url: "https://t.ly/Bwbonuskutusu"
      }
    ]
  },
  {
    title: "EN İYİ DENEME BONUSLARI",
    sites: [
      {
        name: "Radissonbet",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/radissonbet.png",
        url: "https://ptns.io/dEVSR"
      },
      {
        name: "Dedebet",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/dedebet.png",
        url: "https://t.ly/bonuskutusudede"
      },
      {
        name: "Damabet",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/damabet.png",
        url: "https://t.ly/bkutusudama"
      },
      {
        name: "Romabet",
        logo: "https://raw.githubusercontent.com/aiprojeler/bonusum-gelsin/main/logos/romabet.png",
        url: "https://romagir1.com/GWaSyy"
      }
    ]
  }
];

function createCard(site){
  return `
    <a class="card" href="${site.url}" target="_blank" rel="nofollow noopener">
      <div class="logo">
        <img src="${site.logo}" alt="${site.name}">
      </div>
      <div class="badge">GÜVENİLİR SİTE</div>
      <div class="site-name">${site.name}</div>
      <div class="bonus">500 TL DENEME BONUSU</div>
      <span class="btn">BONUSU AL</span>
    </a>
  `;
}

function createSection(group){
  return `
    <section class="section">
      <h2 class="section-title">${group.title}</h2>
      <div class="grid">
        ${group.sites.map(createCard).join("")}
      </div>
    </section>
  `;
}

const randomizedGroups = Math.random() < 0.5 ? groups : groups.slice().reverse();
document.getElementById("sections").innerHTML = randomizedGroups.map(createSection).join("");
</script>

</body>
</html>
